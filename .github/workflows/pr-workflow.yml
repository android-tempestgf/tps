name: Pull Request Workflow

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop, main ]

jobs:
  validate-branch-naming:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate branch naming convention
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "Validating branch name: $BRANCH_NAME"
          
          # Check if branch follows naming convention
          if [[ $BRANCH_NAME =~ ^(feature|bugfix|hotfix|release)\/[A-Z]+-[0-9]+-[a-zA-Z0-9-]+$ ]]; then
            echo "✅ Branch name follows convention"
          else
            echo "❌ Branch name does not follow convention"
            echo "Expected format: feature/TPS-123-description, bugfix/TPS-456-fix-name, etc."
            exit 1
          fi

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'adopt'

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Run tests
        run: ./gradlew testDebugUnitTest

      - name: Upload lint results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/

  validate-commits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          # Get commits in the PR
          COMMITS=$(git log --pretty=format:"%s" origin/${{ github.base_ref }}..${{ github.head_ref }})
          
          echo "Validating commit messages:"
          echo "$COMMITS"
          
          # Check each commit message
          while IFS= read -r commit; do
            if [[ $commit =~ ^(feat|fix|docs|style|refactor|test|chore|ci|perf)(\(.+\))?: .+ ]]; then
              echo "✅ Valid: $commit"
            else
              echo "❌ Invalid: $commit"
              echo "Expected format: type(scope): description"
              echo "Types: feat, fix, docs, style, refactor, test, chore, ci, perf"
              exit 1
            fi
          done <<< "$COMMITS"

  check-pr-target:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate PR target branch
        run: |
          SOURCE_BRANCH="${{ github.head_ref }}"
          TARGET_BRANCH="${{ github.base_ref }}"
          
          echo "Source: $SOURCE_BRANCH -> Target: $TARGET_BRANCH"
          
          # Features and bugfixes should target develop
          if [[ $SOURCE_BRANCH =~ ^(feature|bugfix)\/ ]]; then
            if [[ $TARGET_BRANCH != "develop" ]]; then
              echo "❌ Features and bugfixes must target 'develop' branch"
              exit 1
            fi
          fi
          
          # Hotfixes can target main
          if [[ $SOURCE_BRANCH =~ ^hotfix\/ ]]; then
            if [[ $TARGET_BRANCH != "main" ]]; then
              echo "❌ Hotfixes must target 'main' branch"
              exit 1
            fi
          fi
          
          # Releases can target main
          if [[ $SOURCE_BRANCH =~ ^release\/ ]]; then
            if [[ $TARGET_BRANCH != "main" ]]; then
              echo "❌ Releases must target 'main' branch"
              exit 1
            fi
          fi
          
          echo "✅ PR target validation passed"

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security scan
        uses: github/super-linter@v4
        env:
          DEFAULT_BRANCH: develop
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_KOTLIN: true
          VALIDATE_DOCKERFILE: false
          VALIDATE_YAML: true
          VALIDATE_JSON: true
